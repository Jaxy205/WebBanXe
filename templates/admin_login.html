<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập quản trị · Đại Lợi</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><main class="admin-login-shell"><div class="login-box"><p class="eyebrow">ĐẠI LỢI TRAVEL · DEMO</p><h1>Quản trị website.</h1><p>Nhập mật khẩu được đặt trong biến môi trường <code>ADMIN_PASSWORD</code>.</p>{% for category, message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Mật khẩu quản trị<input class="admin-input" name="password" type="password" autocomplete="current-password" required autofocus></label><button class="admin-btn" type="submit">Đăng nhập ↗</button></form><a href="{{ url_for('index') }}">← Trở về trang chủ</a></div></main></body></html>
