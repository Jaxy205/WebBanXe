{% extends 'admin_base.html' %}{% block title %}{{ 'Sửa xe' if car else 'Thêm xe' }}{% endblock %}{% block content %}
<div class="admin-page-title"><div><p class="eyebrow">QUẢN LÝ XE</p><h1>{{ 'Chỉnh sửa xe' if car else 'Thêm xe mới' }}.</h1></div><a class="admin-btn secondary" href="{{ url_for('admin_cars') }}">← Danh sách xe</a></div>
<div class="admin-card admin-form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Tên xe <input class="admin-input" name="name" maxlength="100" required value="{{ car.name if car else '' }}" placeholder="Toyota Innova"></label><label>Số chỗ hành khách <input class="admin-input" name="seats" type="number" min="1" max="50" required value="{{ car.seats if car else 4 }}"></label><label>Phân loại xe <input class="admin-input" name="kind" maxlength="40" value="{{ car.kind if car else '' }}" placeholder="Sedan / SUV / Minibus"></label><label>Mô tả ngắn <textarea class="admin-input" name="description" maxlength="400">{{ car.description if car else '' }}</textarea></label><label>Ảnh minh họa (trong 3 ảnh demo)<select class="admin-input" name="image_file">{% for file in images %}<option value="{{ file }}" {% if car and car.image_file == file %}selected{% endif %}>{{ file }}</option>{% endfor %}</select></label><label class="checkbox-row"><input type="checkbox" name="active" {% if not car or car.active %}checked{% endif %}> Hiển thị xe ở trang chủ</label><button class="admin-btn" type="submit">{{ 'Lưu thay đổi' if car else 'Tạo xe' }} ↗</button></form></div>
{% endblock %}
