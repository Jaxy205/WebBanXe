<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Quản trị{% endblock %} · Đại Lợi</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="admin-body"><header class="admin-header"><a class="logo" href="{{ url_for('admin_dashboard') }}">ĐẠI LỢI<span> ADMIN</span></a><nav><a href="{{ url_for('admin_dashboard') }}">Đơn đặt xe</a><a href="{{ url_for('admin_cars') }}">Quản lý xe</a><a href="{{ url_for('index') }}" target="_blank" rel="noopener">Xem website ↗</a><form action="{{ url_for('admin_logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="logout-button" type="submit">Đăng xuất</button></form></nav></header>
<main class="admin-main">{% for category, message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
