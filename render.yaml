# Render Dashboard > New > Blueprint > connect repository containing this file.
# Both resources are on Render. IMPORTANT: the FREE PostgreSQL database expires after 30 days.
services:
  - type: web
    name: dai-loi-booking-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dai-loi-booking-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: BOOKING_NOTIFY_TO
        value: thuexedailoi@gmail.com

databases:
  - name: dai-loi-booking-db
    plan: free
    databaseName: dailoi
    user: dailoi
